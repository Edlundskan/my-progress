const $=id=>document.getElementById(id), app=$('app'), date=()=>new Date().toLocaleDateString('sv-SE'), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let d={runs:[],strength:[],checks:[],weights:[],custom:[],plan:[],goals:{weight:70,strength:4,run:2,km:5,pace:345,hr:145}},page=0,draft=null;try{d={...d,...JSON.parse(localStorage.getItem('myprogress')||'{}')}}catch{}function save(){try{localStorage.setItem('myprogress',JSON.stringify(d))}catch{alert('Lagring misslyckades. Exportera din data.')}}const programs=[['Underkropp A','Benpress,Rumänska marklyft,Hip thrust,Benspark,Lårcurl,Vadpress'],['Överkropp A','Latsdrag,Bröstpress,Sittande rodd,Axelpress,Sidolyft,Triceps pushdown'],['Underkropp B','Knäböj,Bulgariska utfall,Hip thrust,Lårcurl,Pallof press'],['Överkropp B','Hantelpress,Enarmsrodd,Latsdrag,Face pulls,Bicepscurl,Dead bug'],['Helkropp A','Benpress,Bröstpress,Sittande rodd,Lårcurl,Pallof press'],['Helkropp B','Knäböj,Rumänska marklyft,Latsdrag,Axelpress,Dead bug'],['Express A','Benpress,Bröstpress,Sittande rodd'],['Express B','Hip thrust,Latsdrag,Axelpress'],['Löparstyrka','Bulgariska utfall,Vadpress,Rumänska marklyft,Pallof press']];const all=()=>[...programs,...d.custom], pace=s=>Math.floor(Math.round(s)/60)+':'+String(Math.round(s)%60).padStart(2,'0'), field=(n,l,v='',t='number',step='any')=>`<label>${l}<input name="${n}" type="${t}" value="${esc(v)}" step="${step}" ${t==='number'?'min="0"':''}></label>`, form=(id,body)=>`<section><form id="${id}">${body}<button>Spara</button></form></section>`, last=a=>[...a].sort((a,b)=>a.date.localeCompare(b.date)).at(-1), hist=n=>[...d.strength].sort((a,b)=>a.date.localeCompare(b.date)).flatMap(p=>p.ex.filter(e=>e.name===n).map(e=>({...e,date:p.date}))), low=()=>{let c=last(d.checks);return c&&c.date===date()&&(c.energy<=2||c.stress>=4||c.sleep<6)};function rec(n){let p=hist(n).at(-1);if(!p)return [0,'Välj startvikt med 2–3 reps i reserv'];let k=p.sets[0].kg;if(low())return [Math.round(k*.9*4)/4,'Lättare belastning idag'];if(p.sets.every(s=>s.reps>=10&&s.rir!==''&&s.rir>=2&&s.kg===k))return [Math.round(k*1.025*4)/4,'Förslag: liten viktökning'];return [k,'Behåll tidigare vikt']}

function render(){let h='',g=d.goals;if(page===0){let w=last(d.weights),r=last(d.runs);h=`<h1>Stronger every day.</h1><div class="grid"><section>Styrkepass<br><strong>${d.strength.length}</strong></section><section>Löppass<br><strong>${d.runs.length}</strong></section><section>Vikt<br><strong>${w?w.value+' kg':'–'}</strong></section><section>Senaste löptempo<br><strong>${r?pace(r.seconds/r.km):'–'}</strong></section></div><section><h2>My Coach</h2>${low()?'Prioritera återhämtning idag.':'Planera nästa träningsvecka.'}<br><button onclick="go(3)">Skapa träningsvecka</button></section>`}if(page===1){h='<h1>Träning</h1>';if(draft){h+=`<section><h2>${esc(draft.name)}</h2>${draft.ex.map((e,i)=>`<h3>${esc(e.name)}</h3><small>${e.reason}</small><div class="set"><small>Kg</small><small>Reps</small><small>RIR</small></div>${e.sets.map((s,j)=>`<div class="set">${['kg','reps','rir'].map(k=>`<input type="number" min="0" step="any" value="${s[k]}" onchange="draft.ex[${i}].sets[${j}].${k}=this.value===''?'':+this.value">`).join('')}</div>`).join('')}<button onclick="draft.ex[${i}].sets.push({kg:0,reps:10,rir:''});render()">+ Set</button> <button onclick="draft.ex.splice(${i},1);render()">Ta bort</button>`).join('')}<input id="extra" placeholder="Ny övning"><button onclick="if($('extra').value.trim()){draft.ex.push({name:$('extra').value.trim(),reason:'Välj startvikt',sets:[{kg:0,reps:10,rir:''}]});render()}">Lägg till</button><p><small>RIR = repetitioner kvar i reserv</small></p><button onclick="finish()">Spara genomfört pass</button> <button onclick="draft=null;render()">Avbryt</button></section>`}else{h+=all().map((p,i)=>`<section><b>${esc(p[0])}</b><p><small>${esc(p[1].replaceAll(',',' · '))}</small></p><button onclick="start(${i})">Starta anpassat pass</button></section>`).join('')+form('custom','<h2>Eget program</h2>'+field('name','Namn','','text')+field('ex','Övningar separerade med komma','','text'))}h+=form('run','<h2>Registrera löpning</h2>'+field('date','Datum',date(),'date')+field('route','Runda','','text')+'<label>Typ<select name="kind"><option>Distans</option><option>Intervaller</option><option>Långpass</option><option>Återhämtning</option></select></label>'+field('km','Distans km')+field('min','Minuter')+field('sec','Sekunder',0)+field('hr','Snittpuls')+field('maxhr','Maxpuls')+field('rpe','Ansträngning 1–10')+'<output id="paceout"></output>')+'<h2>Historik</h2>'+[...d.runs.map(r=>({...r,title:r.route||r.kind,detail:r.km+' km · '+pace(r.seconds/r.km)+' min/km · '+(r.hr||'–')+' bpm'})),...d.strength.map(s=>({...s,title:s.name,detail:s.ex.length+' övningar'}))].sort((a,b)=>b.date.localeCompare(a.date)).map(s=>`<section>${esc(s.title)}<p>${s.date} · ${s.detail}</p></section>`).join('')}
if(page===2){h='<h1>Min träningsresa</h1><select id="period" onchange="trends()">'+[7,30,90,180,365].map(n=>`<option ${n===30?'selected':''}>${n}</option>`).join('')+'</select><select id="metric" onchange="trends()">'+['Snittempo','Snittpuls','Distans','Vikt','Midja','Sömn','HRV','Vilopuls',...new Set(d.strength.flatMap(p=>p.ex.map(e=>'Styrka: '+e.name)))].map(n=>`<option>${esc(n)}</option>`).join('')+'</select><div id="chart"></div><section><h2>Personliga rekord</h2>'+[5,10].map(k=>{let a=d.runs.filter(r=>Math.abs(r.km-k)<.01);return `<p>${k} km: ${a.length?pace(Math.min(...a.map(r=>r.seconds))):'–'}</p>`}).join('')+'</section>'}
if(page===3)h='<h1>My Coach</h1>'+form('plan','<label>Träningsdagar<select name="days"><option>3</option><option>4</option><option>5</option><option selected>6</option></select></label><label>Dagsform<select name="energy"><option>Normal</option><option>Låg</option><option>Hög</option></select></label><label>Tid per pass<select name="duration"><option>25</option><option selected>45</option><option>60</option></select></label>')+d.plan.map((p,i)=>`<section><small>${['Mån','Tis','Ons','Tor','Fre','Lör','Sön'][i]}</small><p>${esc(p)}</p>${all().some(a=>a[0]===p)?`<button onclick="start(${all().findIndex(a=>a[0]===p)})">Starta</button>`:''}</section>`).join('')+'<section><small>Regelbaserade förslag. Anpassa efter dagsform och teknik.</small></section>';
if(page===4)h='<h1>Mina mål</h1>'+form('goals',field('weight','Målvikt',g.weight)+field('strength','Styrkepass per vecka',g.strength)+field('run','Löppass per vecka',g.run)+field('km','Måldistans',g.km)+field('pace','Måltempo i sekunder/km',g.pace)+field('hr','Önskad snittpuls',g.hr));if(page===5)h='<h1>Profil & återhämtning</h1>'+form('check',field('date','Datum',date(),'date')+field('sleep','Sömn timmar')+field('hrv','HRV ms')+field('rest','Vilopuls')+field('energy','Energi 1–5',3)+field('stress','Stress 1–5',3))+form('weight',field('date','Datum',date(),'date')+field('value','Vikt kg')+field('waist','Midja cm'))+'<section><h2>Mina klockor</h2>Garmin och Apple Watch: ej anslutna. Registrera manuellt.</section><section><h2>Säkerhetskopia</h2><p>Data lagras lokalt på denna enhet. Exportera regelbundet.</p><button onclick="backup()">Exportera JSON</button><label>Återställ säkerhetskopia<input type="file" accept=".json" onchange="restore(this)"></label></section>';app.innerHTML=h;$('nav').innerHTML=['Idag','Träning','Trender','Coach','Mål','Profil'].map((n,i)=>`<button onclick="go(${i})">${n}</button>`).join('');if(page===2)trends();let r=$('run');if(r)r.oninput=()=>{let f=Object.fromEntries(new FormData(r));$('paceout').textContent=+f.km>0?pace((+f.min*60+ +f.sec)/+f.km)+' min/km':''}}
function go(i){page=i;render();scrollTo(0,0)}function finish(){if(!draft.ex.length||draft.ex.some(e=>e.sets.some(s=>s.kg===''||s.kg<0||s.reps<1||!Number.isInteger(s.reps)||s.rir!==''&&(s.rir<0||s.rir>10))))return alert('Kontrollera set');d.strength.push(draft);draft=null;save();render();alert('Pass sparat')}
app.onsubmit=e=>{e.preventDefault();let f=Object.fromEntries(new FormData(e.target)),id=e.target.id;if(id==='run'){let seconds=+f.min*60+ +f.sec;if(!(f.km>0&&seconds>0&&+f.sec<60))return alert('Kontrollera tid och distans');d.runs.push({...f,km:+f.km,seconds,hr:+f.hr})}if(id==='custom'){if(!f.name.trim()||!f.ex.trim())return;d.custom.push([f.name,f.ex])}if(id==='check'){if(!f.sleep||f.sleep>24||f.energy<1||f.energy>5||f.stress<1||f.stress>5)return alert('Kontrollera värden');d.checks.push(f)}if(id==='weight'){if(!(f.value>0))return alert('Ange vikt');d.weights.push({...f,value:+f.value})}if(id==='goals'){if(Object.values(f).some(v=>!(+v>0)))return alert('Ange positiva mål');d.goals=Object.fromEntries(Object.entries(f).map(([k,v])=>[k,+v]))}if(id==='plan'){let n=+f.days;d.plan=low()||f.energy==='Låg'?['Lätt helkropp','Promenad','Vila','Lätt helkropp','Vila','Vila','Rörlighet']:n===6?['Underkropp A','Överkropp A','Lugn löpning','Underkropp B','Överkropp B','Vila','Långpass']:n===5?['Underkropp A','Överkropp A','Löpning','Vila','Helkropp B','Vila','Långpass']:n===4?['Helkropp A','Löpning','Vila','Helkropp B','Vila','Lugn löpning','Vila']:['Helkropp A','Vila','Löpning','Vila','Helkropp B','Vila','Vila'];if(+f.duration===25)d.plan=d.plan.map((p,i)=>all().some(a=>a[0]===p)?i%2?'Express B':'Express A':p)}save();render()};function trends(){let m=$('metric').value,n=+$('period').value,a=m.startsWith('Styrka: ')?hist(m.slice(8)).map(e=>({...e,v:Math.max(...e.sets.map(s=>s.kg))})):m==='Vikt'||m==='Midja'?d.weights.map(e=>({...e,v:m==='Vikt'?e.value:e.waist})):['Sömn','HRV','Vilopuls'].includes(m)?d.checks.map(e=>({...e,v:e[{Sömn:'sleep',HRV:'hrv',Vilopuls:'rest'}[m]]})):d.runs.map(e=>({...e,v:m==='Snittempo'?e.seconds/e.km:m==='Snittpuls'?e.hr:e.km}));a=a.filter(e=>e.v!==''&&+e.v>0&&(new Date(date())-new Date(e.date))/86400000<n&&e.date<=date()).sort((a,b)=>a.date.localeCompare(b.date));if(!a.length){$('chart').innerHTML='<section>Registrera värden för att se trenden.</section>';return}let v=a.map(e=>+e.v),lo=Math.min(...v),hi=Math.max(...v),pts=v.map((x,i)=>[20+i*280/Math.max(1,v.length-1),hi===lo?65:110-(x-lo)*90/(hi-lo)]),fmt=x=>m==='Snittempo'?pace(x):x.toFixed(1);$('chart').innerHTML=`<section><strong>${fmt(v.at(-1))}</strong><svg viewBox="0 0 320 130"><polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="#a4e9b5" stroke-width="3"/>${pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="#a4e9b5"/>`).join('')}</svg>${a[0].date} – ${a.at(-1).date}<p>Förändring: ${((v.at(-1)-v[0])/v[0]*100).toFixed(1)} %</p></section>`}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(d)],{type:'application/json'}));a.download='my-progress-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}async function restore(i){try{let x=JSON.parse(await i.files[0].text());if(!['runs','strength','checks','weights','custom','plan'].every(k=>Array.isArray(x[k]))||!x.goals)throw Error();if(confirm('Ersätta nuvarande historik?')){d=x;save();render()}}catch{alert('Ogiltig säkerhetskopia')}}render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
